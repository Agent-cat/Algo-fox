name: CI/CD Deployment pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Navigate to project directory (change path if your project is elsewhere)
            cd ~/Algo-fox

            # Pull latest changes from git
            git pull origin main

            # Install pnpm if missing, then install workspace dependencies
            command -v pnpm &> /dev/null || npm install -g pnpm@10
            pnpm install --frozen-lockfile

            # Typecheck + build the monorepo (turbo caches unchanged tasks)
            pnpm typecheck
            pnpm build

            # Restart all services (web + api + queue worker)
            pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
